[project]
name = "petstore-aqa-framework"
version = "0.1.0"
description = "Production-like API test automation framework for Swagger Petstore OpenAPI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "socksio>=1.0",  # нужен httpx для SOCKS-прокси из окружения (ALL_PROXY)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pytest>=8.2",
    "faker>=25.0",
    "jsonschema>=4.0",
    "allure-pytest>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --alluredir=allure-results --clean-alluredir"
log_level = "INFO"
log_format = "%(levelname)-5s %(name)s %(message)s"
markers = [
    "smoke: fast critical-path checks",
    "regression: full regression coverage",
    "positive: happy-path behavior",
    "negative: invalid input / error handling",
    "contract: OpenAPI contract compatibility",
    "async: exercises the async transport",
    "slow: long-running tests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "config", "factories", "models", "utils"]